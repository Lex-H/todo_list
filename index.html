<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0e0e">
    <title>星願清單</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div id="desktop-ui">
        <div class="pc-app-container">
            <div class="pc-main-content">
                <header class="pc-header">
                    <div class="title-group">
                        <span class="title-icon" aria-hidden="true">✓</span>
                        <div><h1>星願清單</h1><p class="date-string"></p></div>
                    </div>
                </header>
                <form class="add-form desktop-add-form" data-add-form>
                    <label class="sr-only" for="desktop-todo-input">新增任務</label>
                    <input id="desktop-todo-input" name="task" type="text" placeholder="新增一個任務..." autocomplete="off" required>
                    <button class="add-button" type="submit">新增</button>
                </form>
                <main class="task-main"><div class="todo-list" data-todo-list></div></main>
            </div>
            <aside class="pc-nav-side" id="pc-nav">
                <nav class="pc-nav-menu" aria-label="主選單">
                    <button class="pc-nav-item" type="button" data-nav-toggle aria-label="切換側邊欄">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.3c.4-1.7 2.9-1.7 3.4 0a1.7 1.7 0 0 0 2.5 1.1c1.6-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1.1 2.5c1.7.4 1.7 2.9 0 3.4a1.7 1.7 0 0 0-1.1 2.5c.9 1.6-.8 3.3-2.4 2.4a1.7 1.7 0 0 0-2.5 1.1c-.5 1.7-3 1.7-3.4 0a1.7 1.7 0 0 0-2.5-1.1c-1.6.9-3.3-.8-2.4-2.4a1.7 1.7 0 0 0-1.1-2.5c-1.7-.5-1.7-3 0-3.4a1.7 1.7 0 0 0 1.1-2.5c-.9-1.6.8-3.3 2.4-2.4a1.7 1.7 0 0 0 2.5-1.1Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span class="pc-nav-text">設定</span>
                    </button>
                    <div class="pc-nav-item" aria-disabled="true"><span class="nav-symbol">◷</span><span class="pc-nav-text">近期提醒</span></div>
                    <div class="pc-nav-item" aria-disabled="true"><span class="nav-symbol">☆</span><span class="pc-nav-text">收藏項目</span></div>
                </nav>
                <button class="avatar-button desktop-avatar-button" type="button" data-voice-chat aria-label="開始語音對話"><img src="assets/avatar.png" class="avatar" alt="語音對話"></button>
            </aside>
        </div>
    </div>

    <div id="mobile-ui">
        <header class="mobile-header">
            <div class="title-group"><span class="title-icon" aria-hidden="true">✓</span><div><h1>星願清單</h1><p class="date-string"></p></div></div>
        </header>
        <main class="mobile-main"><div class="todo-list" data-todo-list></div></main>
        <div class="mobile-account"><button class="avatar-button" type="button" data-voice-chat aria-label="開始語音對話"><img src="assets/avatar.png" class="avatar" alt="語音對話"></button></div>
        <footer class="mobile-footer">
            <nav class="mobile-nav" aria-label="主要導覽">
                <button class="nav-button" type="button" data-open-settings aria-label="設定"><span aria-hidden="true">⚙</span></button>
                <button class="nav-button" type="button" data-undo aria-label="復原" disabled><span aria-hidden="true">↶</span></button>
                <button class="nav-button" type="button" data-redo aria-label="重做" disabled><span aria-hidden="true">↷</span></button>
                <button class="mobile-add-button" type="button" data-add-blank aria-label="新增空白任務">＋</button>
            </nav>
        </footer>
    </div>
    <dialog class="app-dialog settings-dialog" data-settings-dialog>
        <form method="dialog" class="dialog-top"><h2>設定</h2><button class="dialog-close" aria-label="關閉">×</button></form>
        <p class="dialog-description">填入 Gemini API Key，儲存在這台裝置的瀏覽器。</p>
        <label class="field-label" for="api-key-input">Gemini API Key</label>
        <div class="key-field"><input id="api-key-input" type="password" autocomplete="off" placeholder="輸入 API Key"><button type="button" class="secondary-button" data-toggle-key>顯示</button></div>
        <div class="dialog-actions"><button type="button" class="secondary-button" data-clear-key>清除</button><button type="button" class="primary-button" data-save-key>儲存</button></div>
        <p class="dialog-hint" data-settings-status role="status"></p>
    </dialog>
    <dialog class="app-dialog chat-dialog" data-chat-dialog>
        <div class="dialog-top"><div class="chat-title"><img src="assets/avatar.png" alt=""><div><h2>和星願夥伴聊聊</h2><p data-chat-status role="status">點擊下方按鈕開始錄音</p></div></div><button type="button" class="dialog-close" data-close-chat aria-label="關閉">×</button></div>
        <div class="chat-messages" data-chat-messages aria-live="polite"><p class="chat-empty">點右下方頭像開始說話，再點一次送出。</p></div>
        <div class="chat-controls"><button type="button" class="voice-avatar-control" data-record aria-label="開始錄音"><img src="assets/avatar.png" alt=""><span>點擊頭像開始錄音</span></button><button type="button" class="secondary-button" data-retry-voice hidden>重試語音</button></div>
    </dialog>
</body>
</html>
